services:
  sistema_ropa:
    build: sistema_ropa
    mem_limit: 512m
    ports:
      - "8081:8080"
    environment:
      TZ: America/Argentina/Buenos_Aires
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Argentina/Buenos_Aires
      
      DB_URL: ${DB_URL}
      DB_USER_NAME: ${DB_USER_NAME}
      DB_PASSWORD: ${DB_PASSWORD}

      APP_ADMIN_USER: admin
      APP_ADMIN_PASS: ${ADMIN_PASS}
      APP_EMPLEADO_USER: empleado
      APP_EMPLEADO_PASS: ${EMPLEADO_PASS}

    restart: always
    depends_on:
      ropa:
        condition: service_healthy

  ropa:
    image: mysql:8.0
    ports:
      - "3308:3306"
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - ropa_mysql_data:/var/lib/mysql  
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      
volumes:
  ropa_mysql_data:      